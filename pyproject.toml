[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-ayuda-rag"
version = "0.1.0"
description = "Asistente de mesa de ayuda con RAG en Telegram para Grupo Bios (prueba técnica)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6,<22",
    "openai>=1.54,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "pypdf>=5.0,<6",
    "python-docx>=1.1,<2",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[project.scripts]
mesa-ayuda = "mesa_ayuda_rag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
